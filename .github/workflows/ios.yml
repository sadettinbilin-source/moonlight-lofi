name: iOS

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate catalog and bundled audio
        run: python3 scripts/validate_catalog.py

      - name: Unit tests
        run: swift test --package-path Packages/MoonlightCore

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build and run tests
        run: bash scripts/ci_xcodebuild.sh
