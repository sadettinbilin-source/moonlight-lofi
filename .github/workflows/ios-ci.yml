name: iOS CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select the latest Xcode
        run: bash scripts/select_xcode.sh

      - name: Validate catalog and bundled audio
        run: python3 scripts/validate_catalog.py

      - name: Unit tests
        run: swift test --package-path Packages/MoonlightCore

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: |
          xcodegen generate
          python3 scripts/patch_storekit_scheme.py

      - name: Build and test
        run: bash scripts/ios_ci_xcodebuild.sh

      - name: Export screenshots
        if: always()
        run: bash scripts/export_screenshots.sh "$PWD/TestResults.xcresult" "$PWD/screenshots"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: warn

      - name: Upload test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: TestResults.xcresult
          if-no-files-found: warn
